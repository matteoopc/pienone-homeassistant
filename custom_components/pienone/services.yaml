aggiorna:
registra_pieno:
  fields:
    litri:
      required: true
      example: 40.5
      selector:
        number:
          min: 0.1
          max: 500
          step: 0.01
          unit_of_measurement: L
          mode: box
    euro:
      example: 72.86
      selector:
        number:
          min: 0
          max: 5000
          step: 0.01
          unit_of_measurement: "€"
          mode: box
    prezzo:
      example: 1.799
      selector:
        number:
          min: 0
          max: 10
          step: 0.001
          unit_of_measurement: "€/L"
          mode: box
    km:
      example: 120000
      selector:
        number:
          min: 0
          max: 2000000
          mode: box
    distributore:
      example: Q8 via Appia, Roma
      selector:
        text:
    impianto:
      example: 1002
      selector:
        number:
          min: 1
          max: 9999999
          mode: box
    auto:
      example: Golf
      selector:
        text:
    quando:
      selector:
        datetime:
    pieno_completo:
      default: true
      selector:
        boolean:
